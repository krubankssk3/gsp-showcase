<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ระบบจัดการผลงาน GSP — สำหรับกรรมการ</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config = { prefix: 'tw-', corePlugins: { preflight: false } };</script>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="demoBar"></div>

<!-- เข้าสู่ระบบ -->
<div class="login-wrap hidden" id="loginView">
  <div class="login-card">
    <div id="loginMark"></div>
    <h1>เข้าสู่ระบบกรรมการ</h1>
    <p class="muted" style="margin:0;font-size:14px">ระบบจัดการผลงานการแข่งขันสร้างสรรค์ผลงานคณิตศาสตร์โดยใช้โปรแกรม GSP</p>
    <form id="loginForm">
      <div class="field"><label for="pw">รหัสผ่าน</label><input class="input" type="password" id="pw" autocomplete="current-password" required></div>
      <div id="loginErr" class="tag red hidden"></div>
      <button class="btn btn-primary" type="submit" id="loginBtn" style="justify-content:center">เข้าสู่ระบบ</button>
      <div class="demo-hint hidden" id="demoHint">โหมดสาธิต: ใช้รหัสผ่าน <b class="mono">demo1234</b></div>
      <a href="index.html" class="muted" style="font-size:13.5px;text-align:center">← กลับหน้าเผยแพร่ผลงาน</a>
    </form>
  </div>
</div>

<!-- แอปหลัก -->
<div class="admin hidden" id="appView">
  <aside class="side">
    <a class="brand" href="#dash" id="sideBrand"></a>
    <a class="nv" href="#dash" data-v="dash"></a>
    <a class="nv" href="#comps" data-v="comps"></a>
    <a class="nv" href="#results" data-v="results"></a>
    <a class="nv" href="#import" data-v="import"></a>
    <a class="nv" href="#reports" data-v="reports"></a>
    <a class="nv" href="#site-config" data-v="site-config"></a>
    <a class="nv" href="index.html" target="_blank" rel="noopener" id="nvPublic"></a>
    <div class="sp"></div>
    <div class="who" id="who"></div>
    <a class="nv" href="#" id="logoutBtn"></a>
  </aside>
  <main class="main" id="view"></main>
</div>

<div id="modalRoot"></div>
<div id="toasts" class="toasts"></div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/charts.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script src="js/report.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
